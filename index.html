<!DOCTYPE html>  <html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">  
<meta name="theme-color" content="#07070a">  
<meta name="description" content="ZIVAN — A new social world.">  
<title>ZIVAN</title>  <style>  
*{  
    box-sizing:border-box;  
    margin:0;  
    padding:0;  
}  
  
:root{  
    --bg:#050507;  
    --panel:#0b0b10;  
    --panel2:#101017;  
    --line:#20202b;  
    --text:#f5f5f7;  
    --muted:#8b8b99;  
    --accent:#8b5cf6;  
    --accent2:#4f8cff;  
    --danger:#ff4d6d;  
}  
  
body{  
    background:  
        radial-gradient(circle at 15% 0%,rgba(139,92,246,.14),transparent 28%),  
        radial-gradient(circle at 90% 15%,rgba(79,140,255,.10),transparent 25%),  
        var(--bg);  
    color:var(--text);  
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;  
    min-height:100vh;  
}  
  
button,  
input,  
textarea{  
    font:inherit;  
}  
  
button{  
    cursor:pointer;  
}  
  
.hidden{  
    display:none!important;  
}  
  
.app{  
    min-height:100vh;  
}  
  
/* =========================  
   AUTH  
========================= */  
  
.auth-screen{  
    min-height:100vh;  
    display:flex;  
    align-items:center;  
    justify-content:center;  
    padding:24px;  
}  
  
.auth-box{  
    width:100%;  
    max-width:430px;  
    background:rgba(11,11,16,.88);  
    border:1px solid var(--line);  
    border-radius:28px;  
    padding:30px;  
    box-shadow:0 30px 100px rgba(0,0,0,.45);  
    backdrop-filter:blur(20px);  
}  
  
.logo{  
    font-size:38px;  
    font-weight:900;  
    letter-spacing:-2px;  
}  
  
.logo span{  
    background:linear-gradient(90deg,var(--accent),var(--accent2));  
    -webkit-background-clip:text;  
    background-clip:text;  
    color:transparent;  
}  
  
.tagline{  
    color:var(--muted);  
    margin-top:7px;  
    margin-bottom:26px;  
}  
  
.auth-title{  
    font-size:25px;  
    margin-bottom:7px;  
}  
  
.auth-sub{  
    color:var(--muted);  
    font-size:14px;  
    margin-bottom:20px;  
}  
  
.field{  
    margin-bottom:13px;  
}  
  
.field label{  
    display:block;  
    font-size:12px;  
    color:#aaaab7;  
    margin-bottom:7px;  
}  
  
.input{  
    width:100%;  
    background:#08080d;  
    border:1px solid var(--line);  
    color:white;  
    padding:13px 14px;  
    border-radius:13px;  
    outline:none;  
    transition:.2s;  
}  
  
.input:focus{  
    border-color:rgba(139,92,246,.75);  
    box-shadow:0 0 0 3px rgba(139,92,246,.10);  
}  
  
.auth-btn{  
    width:100%;  
    border:0;  
    border-radius:14px;  
    padding:14px;  
    margin-top:5px;  
    color:white;  
    font-weight:800;  
    background:linear-gradient(100deg,var(--accent),var(--accent2));  
    box-shadow:0 10px 30px rgba(99,102,241,.22);  
}  
  
.switch{  
    text-align:center;  
    color:var(--muted);  
    font-size:13px;  
    margin-top:20px;  
}  
  
.switch button{  
    background:none;  
    border:0;  
    color:#a78bfa;  
    font-weight:800;  
}  
  
.choice-row{  
    display:flex;  
    gap:8px;  
    margin-bottom:16px;  
}  
  
.choice{  
    flex:1;  
    padding:11px;  
    border:1px solid var(--line);  
    border-radius:12px;  
    background:#08080d;  
    color:#aaa;  
}  
  
.choice.active{  
    color:white;  
    border-color:var(--accent);  
    background:rgba(139,92,246,.12);  
}  
  
.otp-box{  
    text-align:center;  
}  
  
.otp-input{  
    text-align:center;  
    letter-spacing:8px;  
    font-size:25px;  
    font-weight:800;  
}  
  
/* =========================  
   MAIN LAYOUT  
========================= */  
  
.shell{  
    display:flex;  
    min-height:100vh;  
}  
  
.sidebar{  
    width:250px;  
    position:fixed;  
    top:0;  
    bottom:0;  
    left:0;  
    padding:28px 18px;  
    border-right:1px solid var(--line);  
    background:rgba(5,5,7,.92);  
    backdrop-filter:blur(18px);  
    z-index:20;  
}  
  
.sidebar .logo{  
    margin:0 12px 35px;  
}  
  
.side-btn{  
    width:100%;  
    border:0;  
    background:transparent;  
    color:#858593;  
    padding:13px 14px;  
    border-radius:13px;  
    text-align:left;  
    margin-bottom:5px;  
    font-weight:700;  
}  
  
.side-btn:hover,  
.side-btn.active{  
    color:white;  
    background:#11111a;  
}  
  
.side-btn .icon{  
    width:27px;  
    display:inline-block;  
}  
  
.main{  
    margin-left:250px;  
    width:calc(100% - 250px);  
    max-width:1000px;  
    min-height:100vh;  
    border-right:1px solid var(--line);  
}  
  
.topbar{  
    height:70px;  
    display:flex;  
    align-items:center;  
    justify-content:space-between;  
    padding:0 24px;  
    border-bottom:1px solid var(--line);  
    position:sticky;  
    top:0;  
    background:rgba(5,5,7,.82);  
    backdrop-filter:blur(18px);  
    z-index:10;  
}  
  
.top-title{  
    font-size:17px;  
    font-weight:850;  
}  
  
.page{  
    padding:22px;  
}  
  
.card{  
    background:rgba(12,12,18,.86);  
    border:1px solid var(--line);  
    border-radius:20px;  
    padding:18px;  
    margin-bottom:15px;  
}  
  
.hero{  
    padding:28px;  
    min-height:230px;  
    display:flex;  
    flex-direction:column;  
    justify-content:center;  
    background:  
        radial-gradient(circle at 90% 20%,rgba(79,140,255,.15),transparent 30%),  
        radial-gradient(circle at 10% 80%,rgba(139,92,246,.16),transparent 35%),  
        #0b0b10;  
}  
  
.hero h1{  
    font-size:clamp(32px,7vw,56px);  
    line-height:1;  
    letter-spacing:-2px;  
}  
  
.hero p{  
    color:var(--muted);  
    margin-top:14px;  
    max-width:550px;  
    line-height:1.6;  
}  
  
.hero-user{  
    color:#b8a5ff;  
    margin-top:18px;  
    font-weight:800;  
}  
  
.composer{  
    display:flex;  
    gap:12px;  
    align-items:center;  
}  
  
.avatar{  
    width:42px;  
    height:42px;  
    border-radius:50%;  
    background:linear-gradient(135deg,var(--accent),var(--accent2));  
    display:flex;  
    align-items:center;  
    justify-content:center;  
    font-weight:900;  
    flex-shrink:0;  
}  
  
.composer-input{  
    flex:1;  
    border:1px solid var(--line);  
    border-radius:14px;  
    background:#08080d;  
    color:#999;  
    padding:13px;  
    cursor:text;  
}  
  
.primary{  
    border:0;  
    color:white;  
    background:linear-gradient(100deg,var(--accent),var(--accent2));  
    border-radius:12px;  
    padding:11px 16px;  
    font-weight:800;  
}  
  
.secondary{  
    border:1px solid var(--line);  
    color:#ddd;  
    background:#0b0b10;  
    border-radius:12px;  
    padding:11px 16px;  
    font-weight:700;  
}  
  
.post-head{  
    display:flex;  
    align-items:center;  
    gap:10px;  
}  
  
.post-name{  
    font-weight:850;  
}  
  
.post-user{  
    color:var(--muted);  
    font-size:12px;  
}  
  
.post-time{  
    color:#666673;  
    font-size:11px;  
    margin-left:auto;  
}  
  
.post-body{  
    margin-top:15px;  
    line-height:1.6;  
    white-space:pre-wrap;  
}  
  
.post-actions{  
    display:flex;  
    gap:8px;  
    margin-top:15px;  
    border-top:1px solid #171720;  
    padding-top:12px;  
}  
  
.action{  
    border:0;  
    background:#0b0b10;  
    color:#999;  
    padding:8px 12px;  
    border-radius:10px;  
}  
  
.action:hover{  
    color:white;  
}  
  
/* =========================  
   EXPLORE  
========================= */  
  
.search{  
    width:100%;  
    padding:14px;  
    border-radius:14px;  
    border:1px solid var(--line);  
    background:#09090e;  
    color:white;  
    outline:none;  
}  
  
.section-title{  
    font-size:15px;  
    margin:22px 0 11px;  
}  
  
.grid{  
    display:grid;  
    grid-template-columns:repeat(2,1fr);  
    gap:12px;  
}  
  
.explore-card{  
    min-height:130px;  
    padding:18px;  
    border:1px solid var(--line);  
    border-radius:18px;  
    background:  
        linear-gradient(145deg,rgba(139,92,246,.08),rgba(79,140,255,.04)),  
        #0b0b10;  
}  
  
.explore-card h3{  
    margin-bottom:8px;  
}  
  
.explore-card p{  
    color:var(--muted);  
    font-size:13px;  
    line-height:1.5;  
}  
  
/* =========================  
   PROFILE  
========================= */  
  
.profile-cover{  
    height:150px;  
    border-radius:20px 20px 0 0;  
    background:  
        radial-gradient(circle at 20% 20%,rgba(139,92,246,.5),transparent 35%),  
        radial-gradient(circle at 80% 70%,rgba(79,140,255,.4),transparent 35%),  
        #11111a;  
}  
  
.profile-info{  
    margin-top:-35px;  
    padding:0 22px 20px;  
}  
  
.profile-big{  
    width:76px;  
    height:76px;  
    border-radius:50%;  
    background:linear-gradient(135deg,var(--accent),var(--accent2));  
    border:4px solid #0b0b10;  
    display:flex;  
    align-items:center;  
    justify-content:center;  
    font-size:25px;  
    font-weight:900;  
}  
  
.profile-name{  
    font-size:22px;  
    font-weight:900;  
    margin-top:12px;  
}  
  
.profile-handle{  
    color:var(--muted);  
    margin-top:3px;  
}  
  
.profile-bio{  
    margin-top:12px;  
    color:#c5c5cf;  
}  
  
.stats{  
    display:flex;  
    gap:28px;  
    margin-top:18px;  
}  
  
.stat b{  
    display:block;  
    font-size:17px;  
}  
  
.stat span{  
    color:var(--muted);  
    font-size:12px;  
}  
  
/* =========================  
   SETTINGS  
========================= */  
  
.setting{  
    padding:15px 0;  
    border-bottom:1px solid #181821;  
}  
  
.setting:last-child{  
    border-bottom:0;  
}  
  
.setting-title{  
    font-weight:800;  
}  
  
.setting-desc{  
    color:var(--muted);  
    font-size:12px;  
    margin-top:4px;  
}  
  
/* =========================  
   MODAL  
========================= */  
  
.overlay{  
    position:fixed;  
    inset:0;  
    background:rgba(0,0,0,.72);  
    display:flex;  
    align-items:center;  
    justify-content:center;  
    padding:18px;  
    z-index:100;  
}  
  
.modal{  
    width:100%;  
    max-width:460px;  
    background:#0c0c12;  
    border:1px solid var(--line);  
    border-radius:22px;  
    padding:22px;  
    box-shadow:0 30px 100px #000;  
}  
  
.modal-head{  
    display:flex;  
    justify-content:space-between;  
    align-items:center;  
    margin-bottom:17px;  
}  
  
.close{  
    background:#15151d;  
    color:#aaa;  
    border:0;  
    border-radius:9px;  
    width:34px;  
    height:34px;  
}  
  
/* =========================  
   BOTTOM NAV  
========================= */  
  
.bottom-nav{  
    display:none;  
}  
  
/* =========================  
   TOAST  
========================= */  
  
.toast{  
    position:fixed;  
    left:50%;  
    bottom:25px;  
    transform:translateX(-50%);  
    background:#161620;  
    border:1px solid #292936;  
    color:white;  
    padding:12px 17px;  
    border-radius:13px;  
    z-index:200;  
    font-size:13px;  
    box-shadow:0 15px 40px #000;  
}  
  
/* =========================  
   RESPONSIVE  
========================= */  
  
@media(max-width:760px){  
  
    .sidebar{  
        display:none;  
    }  
  
    .main{  
        margin-left:0;  
        width:100%;  
        padding-bottom:75px;  
        border:0;  
    }  
  
    .topbar{  
        padding:0 16px;  
    }  
  
    .page{  
        padding:15px;  
    }  
  
    .bottom-nav{  
        display:flex;  
        position:fixed;  
        left:10px;  
        right:10px;  
        bottom:10px;  
        height:62px;  
        border:1px solid #242431;  
        border-radius:20px;  
        background:rgba(10,10,15,.94);  
        backdrop-filter:blur(20px);  
        z-index:50;  
        justify-content:space-around;  
        align-items:center;  
    }  
  
    .bottom-btn{  
        border:0;  
        background:none;  
        color:#777783;  
        font-size:10px;  
        font-weight:700;  
        text-align:center;  
    }  
  
    .bottom-btn .bicon{  
        display:block;  
        font-size:20px;  
        margin-bottom:3px;  
    }  
  
    .bottom-btn.active{  
        color:white;  
    }  
  
    .grid{  
        grid-template-columns:1fr;  
    }  
  
    .hero{  
        min-height:270px;  
        padding:22px;  
    }  
  
    .composer{  
        align-items:flex-start;  
    }  
  
    .composer .primary{  
        display:none;  
    }  
}  
</style>  </head>  <body>  <div id="root"></div>  <div id="toast" class="toast hidden"></div>  <!-- AUTH -->  <div id="authScreen" class="auth-screen">  <div class="auth-box">  

    <div class="logo">ZI<span>V</span>AN</div>  
    <div class="tagline">A new social world.</div>  

    <!-- LOGIN -->  
    <div id="loginPanel">  

        <div class="auth-title">Welcome back</div>  
        <div class="auth-sub">  
            Enter your account details to continue.  
        </div>  

        <div class="field">  
            <label>Username, email or phone</label>  
            <input  
                id="loginIdentifier"  
                class="input"  
                placeholder="@username / email / +91..."  
                autocomplete="username">  
        </div>  

        <div class="field">  
            <label>Password</label>  
            <input  
                id="loginPassword"  
                class="input"  
                type="password"  
                placeholder="Your password"  
                autocomplete="current-password">  
        </div>  

        <button  
            class="auth-btn"  
            onclick="login()">  
            LOG IN  
        </button>  

        <div class="switch">  
            New to ZIVAN?  
            <button onclick="showSignup()">  
                Create account  
            </button>  
        </div>  

    </div>  


    <!-- SIGNUP -->  
    <div id="signupPanel" class="hidden">  

        <div class="auth-title">Create your world</div>  

        <div class="auth-sub">  
            Build your identity on ZIVAN.  
        </div>  

        <div class="field">  
            <label>Full name</label>  
            <input  
                id="fullName"  
                class="input"  
                placeholder="Your full name">  
        </div>  

        <div class="field">  
            <label>Username</label>  
            <input  
                id="username"  
                class="input"  
                placeholder="username">  
        </div>  

        <div class="field">  
            <label>Date of birth</label>  
            <input  
                id="dob"  
                class="input"  
                type="date">  
        </div>  

        <div class="field">  
            <label>Password</label>  
            <input  
                id="signupPassword"  
                class="input"  
                type="password"  
                placeholder="Minimum 8 characters">  
        </div>  

        <div class="field">  
            <label>Verify through</label>  

            <div class="choice-row">  

                <button  
                    id="emailChoice"  
                    class="choice active"  
                    onclick="setChannel('email')">  
                    Email  
                </button>  

                <button  
                    id="phoneChoice"  
                    class="choice"  
                    onclick="setChannel('phone')">  
                    Phone  
                </button>  

            </div>  
        </div>  

        <div  
            id="emailField"  
            class="field">  

            <label>Email</label>  

            <input  
                id="signupEmail"  
                class="input"  
                type="email"  
                placeholder="you@example.com">  

        </div>  

        <div  
            id="phoneField"  
            class="field hidden">  

            <label>Phone number</label>  

            <input  
                id="signupPhone"  
                class="input"  
                type="tel"  
                placeholder="+919876543210">  

        </div>  

        <button  
            class="auth-btn"  
            onclick="requestCode()">  
            SEND VERIFICATION CODE  
        </button>  

        <div class="switch">  
            Already have an account?  
            <button onclick="showLogin()">  
                Log in  
            </button>  
        </div>  

    </div>  


    <!-- OTP -->  
    <div id="otpPanel" class="hidden otp-box">  

        <div class="auth-title">  
            Verify your account  
        </div>  

        <div  
            id="otpMessage"  
            class="auth-sub">  
            Enter the code we sent you.  
        </div>  

        <div class="field">  

            <input  
                id="otpCode"  
                class="input otp-input"  
                inputmode="numeric"  
                maxlength="6"  
                placeholder="••••••">  

        </div>  

        <button  
            class="auth-btn"  
            onclick="verifyCode()">  
            VERIFY & CREATE ACCOUNT  
        </button>  

        <div class="switch">  
            Wrong details?  
            <button onclick="backToSignup()">  
                Go back  
            </button>  
        </div>  

    </div>  

</div>

</div>  <!-- MAIN APP -->  <div id="appScreen" class="app hidden">  <div class="shell">  <!-- DESKTOP SIDEBAR -->  
<aside class="sidebar">  

    <div class="logo">  
        ZI<span>V</span>AN  
    </div>  

    <button  
        class="side-btn active"  
        data-page="Home"  
        onclick="navigate('Home')">  
        <span class="icon">⌂</span>  
        Home  
    </button>  

    <button  
        class="side-btn"  
        data-page="Explore"  
        onclick="navigate('Explore')">  
        <span class="icon">⌕</span>  
        Explore  
    </button>  

    <button  
        class="side-btn"  
        data-page="Create"  
        onclick="openCreate()">  
        <span class="icon">＋</span>  
        Create  
    </button>  

    <button  
        class="side-btn"  
        data-page="Reels"  
        onclick="navigate('Reels')">  
        <span class="icon">▶</span>  
        Reels  
    </button>  

    <button  
        class="side-btn"  
        data-page="Notifications"  
        onclick="navigate('Notifications')">  
        <span class="icon">♡</span>  
        Notifications  
    </button>  

    <button  
        class="side-btn"  
        data-page="Messages"  
        onclick="navigate('Messages')">  
        <span class="icon">✉</span>  
        Messages  
    </button>  

    <button  
        class="side-btn"  
        data-page="Profile"  
        onclick="navigate('Profile')">  
        <span class="icon">◎</span>  
        Profile  
    </button>  

    <button  
        class="side-btn"  
        data-page="Settings"  
        onclick="navigate('Settings')">  
        <span class="icon">⚙</span>  
        Settings  
    </button>  

</aside>  


<!-- MAIN -->  
<main class="main">  

    <header class="topbar">  

        <div  
            id="topTitle"  
            class="top-title">  
            Home  
        </div>  

        <button  
            class="secondary"  
            onclick="logout()">  
            Logout  
        </button>  

    </header>  

    <div id="pageRoot"></div>  

</main>

</div>  <!-- MOBILE NAV -->  <nav class="bottom-nav">  <button  
    class="bottom-btn active"  
    data-page="Home"  
    onclick="navigate('Home')">  
    <span class="bicon">⌂</span>  
    Home  
</button>  

<button  
    class="bottom-btn"  
    data-page="Explore"  
    onclick="navigate('Explore')">  
    <span class="bicon">⌕</span>  
    Explore  
</button>  

<button  
    class="bottom-btn"  
    data-page="Create"  
    onclick="openCreate()">  
    <span class="bicon">＋</span>  
    Create  
</button>  

<button  
    class="bottom-btn"  
    data-page="Notifications"  
    onclick="navigate('Notifications')">  
    <span class="bicon">♡</span>  
    Alerts  
</button>  

<button  
    class="bottom-btn"  
    data-page="Profile"  
    onclick="navigate('Profile')">  
    <span class="bicon">◎</span>

const API = "";

/* =========================  
   HELPERS  
========================= */  
  
function $(id){  
    return document.getElementById(id);  
}  
  
function escapeHTML(value){  
    return String(value ?? "")  
        .replaceAll("&","&amp;")  
        .replaceAll("<","&lt;")  
        .replaceAll(">","&gt;")  
        .replaceAll('"',"&quot;")  
        .replaceAll("'","&#039;");  
}  
  
function showToast(message){  
    const t = $("toast");  
  
    t.textContent = message;  
    t.classList.remove("hidden");  
  
    clearTimeout(window.toastTimer);  
  
    window.toastTimer = setTimeout(()=>{  
        t.classList.add("hidden");  
    },3000);  
}  
  
async function api(path, options={}){  
    const headers = {  
        "Content-Type":"application/json",  
        ...(options.headers || {})  
    };  
  
    if(token){  
        headers["Authorization"] = "Bearer " + token;  
    }  
  
    const response = await fetch(  
        API + path,  
        {  
            ...options,  
            headers  
        }  
    );  
  
    let data = {};  
  
    try{  
        data = await response.json();  
    }catch(e){}  
  
    if(!response.ok){  
        throw new Error(  
            data.detail ||  
            data.error ||  
            "Something went wrong."  
        );  
    }  
  
    return data;  
}

/* =========================  
   SIGNUP OTP  
========================= */  
  
async function requestCode(){  
  
    const full_name =  
        $("fullName").value.trim();  
  
    const username =  
        $("username").value.trim();  
  
    const dob =  
        $("dob").value;  
  
    const password =  
        $("signupPassword").value;  
  
    const email =  
        $("signupEmail").value.trim();  
  
    const phone =  
        $("signupPhone").value.trim();  
  
  
    if(!full_name){  
        showToast("Enter your full name.");  
        return;  
    }  
  
    if(!username){  
        showToast("Enter a username.");  
        return;  
    }  
  
    if(!dob){  
        showToast("Enter your date of birth.");  
        return;  
    }  
  
    if(password.length < 8){  
        showToast(  
            "Password must be at least 8 characters."  
        );  
        return;  
    }  
  
  
    if(channel === "email" && !email){  
        showToast("Enter your email.");  
        return;  
    }  
  
    if(channel === "phone" && !phone){  
        showToast("Enter your phone number.");  
        return;  
    }  
  
  
    try{  
  
        const data = await api(  
            "/api/auth/request-code",  
            {  
                method:"POST",  
                body:JSON.stringify({  
  
                    full_name,  
                    username,  
                    dob,  
  
                    email:  
                        channel === "email"  
                        ? email  
                        : null,  
  
                    phone:  
                        channel === "phone"  
                        ? phone  
                        : null,  
  
                    password,  
  
                    channel  
  
                })  
            }  
        );  
  
  
        challengeId =  
            data.challenge_id;  
  
  
        $("signupPanel")  
            .classList.add("hidden");  
  
        $("otpPanel")  
            .classList.remove("hidden");  
  
  
        $("otpMessage").textContent =  
            "Verification code sent to " +  
            data.destination;  
  
  
        showToast(  
            "Verification code sent."  
        );  
  
  
    }catch(error){  
  
        showToast(error.message);  
  
    }  
}  
  
  
/* =========================  
   VERIFY  
========================= */  
  
async function verifyCode(){  
  
    const code =  
        $("otpCode").value.trim();  
  
  
    if(!challengeId){  
        showToast(  
            "Verification session expired."  
        );  
        return;  
    }  
  
    if(!code){  
        showToast("Enter the verification code.");  
        return;  
    }  
  
  
    try{  
  
        const data = await api(  
            "/api/auth/verify-code",  
            {  
                method:"POST",  
                body:JSON.stringify({  
  
                    challenge_id:  
                        challengeId,  
  
                    code  
  
                })  
            }  
        );  
  
  
        token =  
            data.token;  
  
        meUser =  
            data.user;  
  
        localStorage.setItem(  
            "zivan_token",  
            token  
        );  
  
  
        $("authScreen")  
            .classList.add("hidden");  
  
        $("appScreen")  
            .classList.remove("hidden");  
  
  
        challengeId = null;  
  
        navigate("Home");  
  
        showToast(  
            "Welcome to ZIVAN."  
        );  
  
  
    }catch(error){  
  
        showToast(error.message);  
  
    }  
}

        $("loginIdentifier")

    try{

            {  
                method:"POST",  
                body:JSON.stringify({  
  
                    identifier,  
                    password  
  
                })  
            }  
        );  
  
  
        token =  
            data.token;

            data.user;

        );  
  
  
        $("authScreen")  
            .classList.add("hidden");

async function restoreSession(){  
  
    if(!token){

    }  
  
    try{

            await api("/api/me");  
  
        meUser =

            .classList.remove("hidden");

        );

async function logout(){  
  
    try{  
  
        if(token){  
            await api(  
                "/api/logout",  
                {  
                    method:"POST"  
                }  
            );  
        }  
  
    }catch(e){}  
  
  
    token = "";

function navigate(page){  
  
    currentPage = page;  
  
    $("topTitle").textContent =  
        page === "Create"  
        ? "Create"  
        : page;  
  
  
    document  
        .querySelectorAll(  
            ".side-btn,.bottom-btn"  
        )  
        .forEach(btn=>{  
  
            btn.classList.toggle(  
                "active",  
                btn.dataset.page === page  
            );  
  
        });  
  
  
    if(page === "Home"){  
        renderHome();  
    }  
  
    else if(page === "Explore"){  
        renderExplore();  
    }  
  
    else if(page === "Reels"){  
        renderReels();  
    }  
  
    else if(page === "Notifications"){  
        renderNotifications();  
    }  
  
    else if(page === "Messages"){  
        renderMessages();  
    }  
  
    else if(page === "Profile"){  
        renderProfile();  
    }  
  
    else if(page === "Settings"){  
        renderSettings();  
    }  
  
}

function formatTime(value){

        return "";  
  
    }

                        ${escapeHTML(  
                            n.display_name ||  
                            n.username ||  
                            "Someone"  
                        )}  
                    </strong>  
  
                    <span  
                        style="color:var(--muted)">  
                        ${  
                            n.kind === "follow"  
                            ? " followed you."  
                            : n.kind === "like"  
                            ? " liked your post."  
                            : n.kind === "comment"  
                            ? " commented on your post."  
                            : " interacted with you."  
                        }  
                    </span>  
  
                    <div  
                        style="  
                        color:#666;  
                        font-size:11px;  
                        margin-top:7px">  
                        ${formatTime(  
                            n.created_at  
                        )}  
                    </div>  
  
                </div>  
  
            `).join("");  
  
  
    }catch(error){  
  
        showToast(  
            error.message  
        );  
  
    }  
}
