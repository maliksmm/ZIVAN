<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZIVAN — Social World</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script src="https://unpkg.com/axios/dist/axios.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.min.js"></script>
<style>
:root{--bg:#060609;--p:#0d0d12;--p2:#111118;--line:#242432;--t:#f7f7fb;--m:#8d8d9d;--a:#8b5cf6;--b:#4f8cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:radial-gradient(circle at 70% -10%,#8b5cf62e,transparent 30%),var(--bg)}.top{height:64px;position:sticky;top:0;z-index:10;background:#060609e8;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{font-weight:900;letter-spacing:2px;font-size:22px;background:linear-gradient(90deg,#fff,#9f8cff,#65a4ff);-webkit-background-clip:text;color:transparent}.layout{max-width:1240px;margin:auto;display:flex}.side{display:none;width:220px;padding:20px 12px;position:sticky;top:64px;height:calc(100vh - 64px)}.side button{display:flex;gap:13px;width:100%;padding:13px;border:0;background:transparent;color:var(--m);border-radius:13px;margin-bottom:5px}.side button.active,.side button:hover{background:#15151d;color:#fff}.main{width:100%;max-width:700px;margin:auto;padding:18px 14px 90px}.right{display:none;width:300px;padding:20px}.card{background:#0d0d12e8;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}.hero{padding:25px;background:linear-gradient(135deg,#8b5cf629,#4f8cff14);border-color:#33285b}.hero h1{font-size:32px;margin:12px 0}.muted{color:var(--m)}.tiny{font-size:12px}.pill{display:inline-flex;padding:7px 11px;border-radius:999px;background:#171720;border:1px solid var(--line);font-size:12px;color:#d0d0df}.icon{width:40px;height:40px;border:1px solid var(--line);background:#0e0e14;color:#fff;border-radius:13px}.field{width:100%;padding:14px 15px;border-radius:14px;background:#09090e;border:1px solid #292934;color:#fff;outline:0;margin-top:10px}.field:focus{border-color:#7352d4}.textarea{min-height:100px;resize:vertical}.primary{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(100deg,var(--a),var(--b));color:#fff;font-weight:800;margin-top:14px}.link{border:0;background:transparent;color:#a88cff;font-weight:700;margin-top:14px}.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-weight:900;flex:none}.posthead{display:flex;align-items:center;gap:10px}.postmeta{flex:1}.body{white-space:pre-wrap;line-height:1.55;margin-top:14px}.media{height:170px;border-radius:16px;margin-top:14px;background:linear-gradient(135deg,#15121f,#101827,#191122);display:grid;place-items:center;font-size:42px}.actions{display:flex;gap:4px;margin-top:8px}.actions button{border:0;background:transparent;color:#9292a1;padding:9px;border-radius:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:15px;background:#111118;border:1px solid var(--line);border-radius:15px}.stat b{font-size:20px}.stat span{display:block;color:var(--m);font-size:11px;margin-top:3px}.section{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 14px}.section h2{font-size:19px;margin:0}.auth{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 0,#8b5cf638,transparent 35%),#060609}.authbox{width:min(450px,100%);background:#0d0d12f5;border:1px solid #292638;border-radius:26px;padding:28px}.logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-size:25px;font-weight:1000;margin-bottom:18px}.authbox h1{margin:0;font-size:29px}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);background:#111118;color:var(--m)}.tabs .on{background:#1b1730;color:#fff;border-color:#6247ad}.row{display:flex;gap:9px}.toast{position:fixed;top:75px;left:50%;transform:translateX(-50%);z-index:99;background:#171720;border:1px solid #39394a;border-radius:13px;padding:11px 15px;font-size:13px}.bottom{position:fixed;bottom:0;left:0;right:0;height:68px;z-index:20;background:#08080cf5;backdrop-filter:blur(18px);border-top:1px solid #ffffff12;display:flex;justify-content:space-around}.bottom button{border:0;background:transparent;color:#77778a;font-size:10px;min-width:55px}.bottom i{display:block;font-size:19px;margin-bottom:4px}.bottom .active{color:#fff}.create{width:46px!important;height:46px;margin-top:10px;border-radius:15px!important;background:linear-gradient(135deg,var(--a),var(--b))!important;color:#fff!important;font-size:20px!important}.settings{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid #1c1c25}.settings:last-child{border:0}.settings .si{width:38px;height:38px;border-radius:12px;background:#171720;display:grid;place-items:center}.settings .txt{flex:1}.settings b{display:block;font-size:14px}.settings small{color:var(--m)}.profilecover{height:130px;border-radius:18px;background:linear-gradient(135deg,#241642,#10244a,#17121e)}.profilemain{margin-top:-28px;padding:0 4px}.edit{border:0;border-radius:12px;padding:10px 15px;background:#fff;color:#08080b;font-weight:800}@media(min-width:900px){.side{display:block}.right{display:block}.bottom{display:none}.main{padding-bottom:30px}}
</style></head><body><div id="root"></div><script type="text/babel">
const{useState,useEffect}=React;const API="";const nav=[['Home','fa-house'],['Explore','fa-compass'],['Notifications','fa-bell'],['Messages','fa-comment-dots'],['Profile','fa-user'],['Settings','fa-gear']];
const token=()=>localStorage.getItem('zivan_token')||'';async function api(method,url,data){const h={'Content-Type':'application/json'},t=token();if(t)h.Authorization='Bearer '+t;return(await axios({method,url:API+url,data,headers:h})).data}
function Toast({msg}){return msg?<div className="toast">{msg}</div>:null}
function Auth({setUser,toast}){const[mode,setMode]=useState('login'),[channel,setChannel]=useState('email'),[step,setStep]=useState(1),[cid,setCid]=useState(null),[form,setForm]=useState({identifier:'',full_name:'',username:'',dob:'',email:'',phone:'',password:'',code:''});const set=k=>e=>setForm({...form,[k]:e.target.value});async function submit(){try{if(mode==='login'){const d=await api('POST','/api/auth/login',{identifier:form.identifier,password:form.password});localStorage.setItem('zivan_token',d.token);localStorage.setItem('zivan_user',JSON.stringify(d.user));setUser(d.user);toast('Welcome back.');return}const d=await api('POST','/api/auth/request-code',{channel,username:form.username,full_name:form.full_name,dob:form.dob,email:channel==='email'?form.email:null,phone:channel==='phone'?form.phone:null,password:form.password});setCid(d.challenge_id);setStep(2);toast('Verification code sent.')}catch(e){toast(e.response?.data?.detail||'Something went wrong.')}}async function verify(){try{const d=await api('POST','/api/auth/verify-code',{challenge_id:cid,code:form.code});localStorage.setItem('zivan_token',d.token);localStorage.setItem('zivan_user',JSON.stringify(d.user));setUser(d.user);toast('ZIVAN account created.')}catch(e){toast(e.response?.data?.detail||'Verification failed.')}}return <div className="auth"><div className="authbox"><div className="logo">Z</div><h1>{mode==='login'?'Welcome to ZIVAN':'Create your ZIVAN account'}</h1><p className="muted">{mode==='login'?'Your social world starts here.':'One account. Your whole social world.'}</p><div className="tabs"><button className={mode==='login'?'on':''} onClick={()=>{setMode('login');setStep(1)}}>LOGIN</button><button className={mode==='signup'?'on':''} onClick={()=>setMode('signup')}>SIGN UP</button></div>{mode==='login'?<><input className="field" placeholder="Email, username or phone" value={form.identifier} onChange={set('identifier')}/><input className="field" type="password" placeholder="Password" value={form.password} onChange={set('password')} onKeyDown={e=>e.key==='Enter'&&submit()}/><button className="primary" onClick={submit}>LOGIN</button></>:step===1?<><input className="field" placeholder="Full name" value={form.full_name} onChange={set('full_name')}/><input className="field" placeholder="Username" value={form.username} onChange={set('username')}/><label className="tiny muted">Date of birth</label><input className="field" type="date" value={form.dob} onChange={set('dob')}/><div className="tabs"><button className={channel==='email'?'on':''} onClick={()=>setChannel('email')}>EMAIL</button><button className={channel==='phone'?'on':''} onClick={()=>setChannel('phone')}>PHONE</button></div>{channel==='email'?<input className="field" type="email" placeholder="Email address" value={form.email} onChange={set('email')}/>:<input className="field" type="tel" placeholder="Phone with country code e.g. +91..." value={form.phone} onChange={set('phone')}/>}<input className="field" type="password" placeholder="Password (8+ characters)" value={form.password} onChange={set('password')}/><button className="primary" onClick={submit}>SEND VERIFICATION CODE</button></>:<><p className="muted">Enter the 6-digit code sent to your {channel}.</p><input className="field" inputMode="numeric" maxLength="10" placeholder="Verification code" value={form.code} onChange={set('code')} onKeyDown={e=>e.key==='Enter'&&verify()}/><button className="primary" onClick={verify}>VERIFY & CREATE ACCOUNT</button><button className="link" onClick={()=>setStep(1)}>← Back</button></>}<p className="tiny muted">ZIVAN · Verified authentication foundation</p></div></div>}
function App(){const[user,setUser]=useState(()=>JSON.parse(localStorage.getItem('zivan_user')||'null'));const[page,setPage]=useState('Home');const[msg,setMsg]=useState('');const toast=m=>{setMsg(m);setTimeout(()=>setMsg(''),2200)};if(!user)return <><Toast msg={msg}/><Auth setUser={setUser} toast={toast}/></>;async function logout(){try{await api('POST','/api/logout')}catch(e){}localStorage.removeItem('zivan_token');localStorage.removeItem('zivan_user');setUser(null)}return <div className="app"><Toast msg={msg}/><header className="top"><div className="brand">ZIVAN</div><div className="row"><button className="icon" onClick={()=>setPage('Explore')}><i className="fa-solid fa-magnifying-glass"/></button><button className="icon" onClick={()=>setPage('Notifications')}><i className="fa-solid fa-bell"/></button></div></header><div className="layout"><aside className="side">{nav.map(([n,i])=><button key={n} className={page===n?'active':''} onClick={()=>setPage(n)}><i className={'fa-solid '+i}/>{n}</button>)}<button onClick={logout}><i className="fa-solid fa-right-from-bracket"/>Log out</button></aside><main className="main">{page==='Home'&&<Home user={user} setPage={setPage}/>} {page==='Explore'&&<Explore/>}{page==='Notifications'&&<Notifications/>}{page==='Messages'&&<Messages/>}{page==='Profile'&&<Profile user={user} setUser={setUser}/>} {page==='Settings'&&<Settings logout={logout}/>}</main><aside className="right"><div className="card"><b>Build status</b><p className="muted tiny">Phase 1 · verified auth foundation</p><span className="pill">● ZIVAN API LIVE</span></div><div className="card"><b>Coming next</b><p className="muted tiny">Stories · Reels · Chat · Worlds · Creator tools · AI</p></div></aside></div><nav className="bottom"><button className={page==='Home'?'active':''} onClick={()=>setPage('Home')}><i className="fa-solid fa-house"/>Home</button><button className={page==='Explore'?'active':''} onClick={()=>setPage('Explore')}><i className="fa-solid fa-compass"/>Explore</button><button className="create" onClick={()=>setPage('Home')}><i className="fa-solid fa-plus"/></button><button className={page==='Notifications'?'active':''} onClick={()=>setPage('Notifications')}><i className="fa-solid fa-bell"/>Notifications</button><button className={page==='Profile'?'active':''} onClick={()=>setPage('Profile')}><i className="fa-solid fa-user"/>Profile</button></nav></div>}
function Home({user,setPage}){const[posts,setPosts]=useState([]),[body,setBody]=useState(''),[loading,setLoading]=useState(true);async function load(){try{setPosts((await api('GET','/api/feed')).posts||[])}catch(e){}setLoading(false)}useEffect(()=>{load()},[]);async function post(){if(!body.trim())return;try{await api('POST','/api/posts',{body:body.trim(),media_url:''});setBody('');load()}catch(e){}}return <><div className="card hero"><span className="pill">✦ ZIVAN · LIVE</span><h1>One social world.<br/>Built differently.</h1><p className="muted">Welcome, @{user.username}. Your social world starts here.</p><button className="primary" style={{maxWidth:230}} onClick={()=>setPage('Profile')}>Open my profile</button></div><div className="card"><textarea className="field textarea" style={{margin:0}} placeholder="What do you want to share?" value={body} onChange={e=>setBody(e.target.value)}/><button className="primary" onClick={post}>SHARE POST</button></div><div className="section"><h2>Your feed</h2><span className="muted tiny">{posts.length} posts</span></div>{loading&&<div className="card muted">Loading your feed...</div>}{!loading&&!posts.length&&<div className="card" style={{textAlign:'center'}}><div className="avatar" style={{margin:'auto'}}>✦</div><h3>Your feed is empty</h3><p className="muted tiny">Create your first post.</p></div>}{posts.map(p=><Post key={p.id} post={p}/>)}</>}
function Post({post}){const[liked,setLiked]=useState(false),[likes,setLikes]=useState(post.likes||0),[comment,setComment]=useState('');async function like(){try{await api(liked?'DELETE':'POST','/api/posts/'+post.id+'/like');setLiked(!liked);setLikes(v=>Math.max(0,v+(liked?-1:1)))}catch(e){}}async function send(){if(!comment.trim())return;try{await api('POST','/api/posts/'+post.id+'/comments',{body:comment.trim()});setComment('')}catch(e){}}return <div className="card"><div className="posthead"><div className="avatar">{(post.username||'Z')[0].toUpperCase()}</div><div className="postmeta"><b>{post.display_name||post.username}</b><div className="muted tiny">@{post.username}</div></div><i className="fa-solid fa-ellipsis"/></div><div className="body">{post.body}</div><div className="media">✦</div><div className="actions"><button onClick={like}><i className={liked?'fa-solid fa-heart':'fa-regular fa-heart'}/> {likes}</button><button><i className="fa-regular fa-comment"/> {post.comments||0}</button><button><i className="fa-solid fa-share"/> Share</button><button><i className="fa-regular fa-bookmark"/> Save</button></div><div className="row"><input className="field" style={{margin:0}} placeholder="Write a comment..." value={comment} onChange={e=>setComment(e.target.value)}/><button className="icon" onClick={send}><i className="fa-solid fa-paper-plane"/></button></div></div>}
function Explore(){const[q,setQ]=useState(''),[users,setUsers]=useState([]);useEffect(()=>{const t=setTimeout(async()=>{if(!q.trim())return setUsers([]);try{setUsers((await api('GET','/api/search?q='+encodeURIComponent(q))).users||[])}catch(e){}},300);return()=>clearTimeout(t)},[q]);return <><div className="section"><h2>Explore</h2><span className="pill">Discover</span></div><div className="card"><input className="field" style={{margin:0}} placeholder="Search people, posts, hashtags and Worlds" value={q} onChange={e=>setQ(e.target.value)}/>{users.map(u=><div className="row" style={{alignItems:'center',padding:'12px 0'}} key={u.id}><div className="avatar">{u.username[0].toUpperCase()}</div><div><b>{u.display_name||u.username}</b><div className="muted tiny">@{u.username}</div></div></div>)}</div><div className="grid"><div className="card"><b>Creators</b><p className="muted tiny">Discover creators.</p></div><div className="card"><b>Worlds</b><p className="muted tiny">Communities coming next.</p></div><div className="card"><b>Trending</b><p className="muted tiny">Topics and conversations.</p></div><div className="card"><b>Reels</b><p className="muted tiny">Short video coming next.</p></div></div></>}
function Notifications(){const[items,setItems]=useState([]);useEffect(()=>{api('GET','/api/notifications').then(d=>setItems(d.notifications||[])).catch(()=>{})},[]);return <><div className="section"><h2>Notifications</h2></div><div className="card">{!items.length?<div style={{textAlign:'center',padding:30}} className="muted">No notifications yet.</div>:items.map(i=><div className="settings" key={i.id}><div className="si"><i className="fa-solid fa-bell"/></div><div className="txt"><b>{i.kind==='follow'?'New follower':i.kind==='like'?'Post liked':'New comment'}</b><small>{i.username?'@'+i.username:'ZIVAN'}</small></div></div>)}</div></>}
function Messages(){return <><div className="section"><h2>Messages</h2></div><div className="card" style={{textAlign:'center',padding:40}}><div className="avatar" style={{margin:'auto',width:60,height:60}}><i className="fa-solid fa-comments"/></div><h3>Messages are coming next.</h3><p className="muted tiny">1-to-1 and group chat will be part of the next ZIVAN phase.</p></div></>}
function Profile({user,setUser}){const[f,setF]=useState(0),[g,setG]=useState(0),[edit,setEdit]=useState(false),[name,setName]=useState(user.display_name||user.username),[bio,setBio]=useState(user.bio||'');async function load(){try{const d=await api('GET','/api/me');setUser(d.user);setF(d.followers||0);setG(d.following||0);setName(d.user.display_name||d.user.username);setBio(d.user.bio||'');localStorage.setItem('zivan_user',JSON.stringify(d.user))}catch(e){}}useEffect(()=>{load()},[]);async function save(){try{const d=await api('PATCH','/api/me',{display_name:name,bio});setUser(d.user);localStorage.setItem('zivan_user',JSON.stringify(d.user));setEdit(false)}catch(e){}}return <><div className="card"><div className="profilecover"/><div className="profilemain"><div style={{display:'flex',justifyContent:'space-between',alignItems:'end'}}><div className="avatar" style={{width:74,height:74,border:'4px solid var(--bg)'}}>{user.username[0].toUpperCase()}</div><button className="edit" onClick={()=>setEdit(!edit)}>{edit?'Cancel':'Edit profile'}</button></div>{!edit?<><h2>{user.display_name||user.username}</h2><div className="muted">@{user.username}</div><p className="muted tiny">{user.bio||'Building my world on ZIVAN.'}</p></>:<><input className="field" value={name} onChange={e=>setName(e.target.value)} placeholder="Display name"/><textarea className="field textarea" value={bio} onChange={e=>setBio(e.target.value)} placeholder="Bio"/><button className="primary" onClick={save}>SAVE PROFILE</button></>}<div className="grid"><div className="stat"><b>—</b><span>Posts</span></div><div className="stat"><b>{f}</b><span>Followers</span></div><div className="stat"><b>{g}</b><span>Following</span></div><div className="stat"><b>0</b><span>Worlds</span></div></div></div></div><div className="card"><b>Profile identity</b><p className="muted tiny">Verified contact is protected by the auth system.</p></div></>}
function Settings({logout}){return <><div className="section"><h2>Settings</h2></div><div className="card"><div className="settings"><div className="si"><i className="fa-solid fa-lock"/></div><div className="txt"><b>Privacy & security</b><small>Account visibility and sessions.</small></div><i className="fa-solid fa-chevron-right muted"/></div><div className="settings"><div className="si"><i className="fa-solid fa-user-slash"/></div><div className="txt"><b>Blocked accounts</b><small>Manage blocked accounts.</small></div><i className="fa-solid fa-chevron-right muted"/></div><div className="settings"><div className="si"><i className="fa-solid fa-bell"/></div><div className="txt"><b>Notifications</b><small>Manage your notifications.</small></div><i className="fa-solid fa-chevron-right muted"/></div></div><div className="card"><button className="primary" style={{background:'#171118',color:'#ff7184'}} onClick={logout}>LOG OUT</button></div></>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
